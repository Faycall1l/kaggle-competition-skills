name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and test tools
        run: pip install pytest black mypy
      - name: pytest
        run: python -m pytest tests/ -q
      - name: black
        run: python -m black --check .
      - name: mypy
        run: python -m mypy skills/
